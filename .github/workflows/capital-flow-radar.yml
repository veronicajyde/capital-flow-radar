name: Capital Flow Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Capital Flow Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import gzip
          import html
          import time
          import urllib.request
          import urllib.parse
          import urllib.error
          from datetime import datetime, timezone, timedelta

          SEC_UA = "Capital Flow Radar veronicajyde@gmail.com"
          STATE_FILE = "radar_state.json"

          CAPITAL_WORDS = [
              "capital expenditure", "capital expenditures", "capex",
              "investment", "investments", "funding", "financing",
              "contract", "contracts", "agreement", "definitive agreement",
              "purchase commitment", "purchase commitments",
              "order", "orders", "backlog", "capacity expansion",
              "expansion", "data center", "datacenter",
              "infrastructure", "artificial intelligence",
              "cloud infrastructure", "semiconductor",
              "manufacturing facility", "facility", "construction",
              "equipment", "supply agreement", "strategic partnership"
          ]

          BENEFICIARY_WORDS = [
              "awarded to", "awarded", "selected", "supplier",
              "supplies", "supply", "contractor", "partner",
              "purchase from", "purchases from", "vendor",
              "equipment provider", "provider", "customer",
              "orders from", "ordered from", "will purchase",
              "will procure", "procure from", "agreement with"
          ]

          INFRA_WORDS = [
              "data center", "datacenter", "power", "grid",
              "transmission", "semiconductor", "chip",
              "manufacturing", "factory", "facility", "capacity",
              "server", "servers", "gpu", "cloud", "infrastructure",
              "construction", "energy", "battery", "network"
          ]

          def fetch(url, timeout=20, retries=2):
              for attempt in range(retries + 1):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": SEC_UA,
                              "Accept-Encoding": "gzip"
                          }
                      )

                      with urllib.request.urlopen(
                          req,
                          timeout=timeout
                      ) as r:
                          data = r.read()

                          if r.headers.get(
                              "Content-Encoding", ""
                          ).lower() == "gzip":
                              data = gzip.decompress(data)

                          return data.decode(
                              "utf-8",
                              errors="replace"
                          )

                  except urllib.error.HTTPError as e:
                      print(
                          f"HTTP {e.code} for {url[:100]}"
                      )

                      if e.code == 429 and attempt < retries:
                          wait = 5 * (attempt + 1)
                          print(
                              f"Rate limited. "
                              f"Waiting {wait}s..."
                          )
                          time.sleep(wait)
                          continue

                      return ""

                  except Exception as e:
                      print(
                          f"FETCH ERROR: {str(e)}"
                      )

                      if attempt < retries:
                          time.sleep(2)

              return ""

          def clean_text(value):
              value = html.unescape(value or "")
              value = re.sub(r"<[^>]+>", " ", value)
              value = re.sub(r"\s+", " ", value)
              return value.strip()

          def money_values(text):
              values = []

              patterns = [
                  r"\$\s?(\d+(?:\.\d+)?)\s*(billion|bn|million|mn|thousand|k|m)\b",
                  r"(\d+(?:\.\d+)?)\s*(billion|bn|million|mn)\s+(?:dollars|USD)"
              ]

              for pattern in patterns:
                  for match in re.finditer(
                      pattern,
                      text,
                      re.I
                  ):
                      try:
                          value = float(match.group(1))
                          unit = match.group(2).lower()

                          if unit in ("billion", "bn"):
                              value *= 1_000_000_000
                          elif unit in ("million", "mn", "m"):
                              value *= 1_000_000
                          elif unit in ("thousand", "k"):
                              value *= 1_000

                          values.append(value)

                      except Exception:
                          pass

              return values

          def money_label(values):
              if not values:
                  return "Not detected"

              value = max(values)

              if value >= 1_000_000_000:
                  return f"${value / 1_000_000_000:.2f}B"

              if value >= 1_000_000:
                  return f"${value / 1_000_000:.1f}M"

              return f"${value:,.0f}"

          def score_text(text):
              lower = " " + text.lower() + " "

              capital_hits = sum(
                  1 for word in CAPITAL_WORDS
                  if word.lower() in lower
              )

              infra_hits = sum(
                  1 for word in INFRA_WORDS
                  if word.lower() in lower
              )

              beneficiary_hits = sum(
                  1 for word in BENEFICIARY_WORDS
                  if word.lower() in lower
              )

              amounts = money_values(text)

              score = 0

              if amounts:
                  largest = max(amounts)

                  if largest >= 10_000_000_000:
                      score += 40
                  elif largest >= 1_000_000_000:
                      score += 35
                  elif largest >= 500_000_000:
                      score += 28
                  elif largest >= 100_000_000:
                      score += 20
                  elif largest >= 25_000_000:
                      score += 12
                  else:
                      score += 5

              score += min(capital_hits * 3, 15)
              score += min(infra_hits * 4, 20)
              score += min(beneficiary_hits * 5, 20)

              return min(score, 100), amounts, beneficiary_hits

          def parse_time(value):
              try:
                  value = value.strip()

                  if value.endswith("Z"):
                      value = value[:-1] + "+00:00"

                  dt = datetime.fromisoformat(value)

                  if dt.tzinfo is None:
                      dt = dt.replace(
                          tzinfo=timezone.utc
                      )

                  return dt.astimezone(timezone.utc)

              except Exception:
                  return None

          def recent(dt):
              if not dt:
                  return False

              cutoff = (
                  datetime.now(timezone.utc)
                  - timedelta(hours=24)
              )

              return dt >= cutoff

          def parse_atom(feed):
              entries = re.findall(
                  r"<entry>(.*?)</entry>",
                  feed,
                  re.S | re.I
              )

              results = []

              for entry in entries:
                  title = re.search(
                      r"<title[^>]*>(.*?)</title>",
                      entry,
                      re.S | re.I
                  )

                  link = re.search(
                      r'<link[^>]+href="([^"]+)"',
                      entry,
                      re.I
                  )

                  updated = re.search(
                      r"<updated>(.*?)</updated>",
                      entry,
                      re.S | re.I
                  )

                  summary = re.search(
                      r"<summary[^>]*>(.*?)</summary>",
                      entry,
                      re.S | re.I
                  )

                  if not title:
                      continue

                  results.append({
                      "title": clean_text(
                          title.group(1)
                      ),
                      "link": (
                          link.group(1)
                          if link else ""
                      ),
                      "updated": (
                          updated.group(1).strip()
                          if updated else ""
                      ),
                      "summary": clean_text(
                          summary.group(1)
                          if summary else ""
                      )
                  })

              return results

          def load_tickers():
              url = (
                  "https://www.sec.gov/files/"
                  "company_tickers.json"
              )

              raw = fetch(url)

              if not raw:
                  return {}

              try:
                  data = json.loads(raw)
              except Exception:
                  return {}

              result = {}

              for item in data.values():
                  ticker = str(
                      item.get("ticker", "")
                  ).upper().strip()

                  company = str(
                      item.get("title", "")
                  ).strip()

                  if ticker and company:
                      result[ticker] = company

              return result

          def get_sec_events():
              feeds = [
                  (
                      "8-K",
                      "https://www.sec.gov/cgi-bin/"
                      "browse-edgar?action=getcurrent"
                      "&type=8-K&company="
                      "&dateb=&owner=exclude"
                      "&count=100&output=atom"
                  ),
                  (
                      "6-K",
                      "https://www.sec.gov/cgi-bin/"
                      "browse-edgar?action=getcurrent"
                      "&type=6-K&company="
                      "&dateb=&owner=exclude"
                      "&count=100&output=atom"
                  ),
                  (
                      "S-1",
                      "https://www.sec.gov/cgi-bin/"
                      "browse-edgar?action=getcurrent"
                      "&type=S-1&company="
                      "&dateb=&owner=exclude"
                      "&count=100&output=atom"
                  ),
                  (
                      "S-3",
                      "https://www.sec.gov/cgi-bin/"
                      "browse-edgar?action=getcurrent"
                      "&type=S-3&company="
                      "&dateb=&owner=exclude"
                      "&count=100&output=atom"
                  ),
                  (
                      "424B4",
                      "https://www.sec.gov/cgi-bin/"
                      "browse-edgar?action=getcurrent"
                      "&type=424B4&company="
                      "&dateb=&owner=exclude"
                      "&count=100&output=atom"
                  )
              ]

              events = []

              for form, url in feeds:
                  print(f"Checking SEC {form}")

                  raw = fetch(
                      url,
                      timeout=15,
                      retries=1
                  )

                  if not raw:
                      continue

                  for item in parse_atom(raw):
                      dt = parse_time(
                          item["updated"]
                      )

                      if not recent(dt):
                          continue

                      combined = (
                          item["title"]
                          + " "
                          + item["summary"]
                      )

                      score, amounts, beneficiary_hits = (
                          score_text(combined)
                      )

                      if not amounts:
                          continue

                      if score < 18:
                          continue

                      events.append({
                          "type": "SEC",
                          "form": form,
                          "title": item["title"],
                          "link": item["link"],
                          "source": "SEC",
                          "seen": item["updated"],
                          "text": combined,
                          "score": score,
                          "amounts": amounts,
                          "beneficiary_hits": beneficiary_hits
                      })

              return events

          def get_news_events():
              # ONE consolidated GDELT query.
              # This avoids hammering GDELT every 5 minutes.
              query = (
                  '("billion" OR "million") '
                  '(contract OR investment OR capex OR '
                  '"capital expenditure" OR supplier OR '
                  'purchase OR order OR agreement) '
                  '(AI OR "artificial intelligence" OR '
                  '"data center" OR datacenter OR '
                  'semiconductor OR infrastructure OR '
                  'energy OR cloud)'
              )

              params = urllib.parse.urlencode({
                  "query": query,
                  "mode": "artlist",
                  "maxrecords": "50",
                  "format": "json",
                  "timespan": "24h",
                  "sort": "datedesc"
              })

              url = (
                  "https://api.gdeltproject.org/"
                  "api/v2/doc/doc?"
                  + params
              )

              print("Checking consolidated GDELT feed")

              raw = fetch(
                  url,
                  timeout=25,
                  retries=2
              )

              if not raw:
                  return []

              try:
                  data = json.loads(raw)
              except Exception as e:
                  print(
                      "GDELT JSON error:",
                      str(e)
                  )
                  return []

              events = []

              for article in data.get(
                  "articles",
                  []
              ):
                  title = clean_text(
                      article.get("title", "")
                  )

                  if not title:
                      continue

                  score, amounts, beneficiary_hits = (
                      score_text(title)
                  )

                  if not amounts:
                      continue

                  if score < 18:
                      continue

                  events.append({
                      "type": "NEWS",
                      "title": title,
                      "link": article.get(
                          "url",
                          ""
                      ),
                      "source": article.get(
                          "domain",
                          "News"
                      ),
                      "seen": article.get(
                          "seendate",
                          ""
                      ),
                      "text": title,
                      "score": score,
                      "amounts": amounts,
                      "beneficiary_hits": beneficiary_hits
                  })

              return events

          def find_ticker(title, ticker_map):
              upper = title.upper()

              explicit = re.findall(
                  r"([A-Z]{1,5})",
                  upper
              )

              for ticker in explicit:
                  if ticker in ticker_map:
                      return ticker

              direct = re.findall(
                  r"(?:NASDAQ|NYSE|NYSEAMERICAN|AMEX)"
                  r"[:\s]+([A-Z]{1,5})",
                  upper
              )

              for ticker in direct:
                  if ticker in ticker_map:
                      return ticker

              return ""

          def find_candidates(
              title,
              ticker_map
          ):
              text = re.sub(
                  r"[^A-Z0-9 ]",
                  " ",
                  title.upper()
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              ).strip()
