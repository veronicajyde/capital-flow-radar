name: Capital Flow Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Final Capital Flow Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.parse
          import gzip
          import json
          import os
          import re
          import html
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          UA = "Capital Flow Radar veronicajyde@gmail.com"
          STATE_FILE = Path("radar_state.json")

          # =========================================================
          # HTTP
          # =========================================================

          def fetch(url, host=None):
              headers = {
                  "User-Agent": UA,
                  "Accept-Encoding": "gzip, deflate",
              }

              if host:
                  headers["Host"] = host

              req = urllib.request.Request(
                  url,
                  headers=headers
              )

              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read()

                  if r.headers.get(
                      "Content-Encoding", ""
                  ).lower() == "gzip":
                      data = gzip.decompress(data)

                  return data.decode(
                      "utf-8",
                      errors="replace"
                  )

          # =========================================================
          # TELEGRAM
          # =========================================================

          def telegram(message):
              token = os.environ["TELEGRAM_BOT_TOKEN"]
              chat = os.environ["TELEGRAM_CHAT_ID"]

              url = (
                  f"https://api.telegram.org/"
                  f"bot{token}/sendMessage"
              )

              payload = urllib.parse.urlencode({
                  "chat_id": chat,
                  "text": message,
                  "disable_web_page_preview": "true"
              }).encode()

              req = urllib.request.Request(
                  url,
                  data=payload,
                  method="POST"
              )

              with urllib.request.urlopen(
                  req,
                  timeout=30
              ):
                  pass

          # =========================================================
          # STATE
          # =========================================================

          def load_state():
              if not STATE_FILE.exists():
                  return set()

              try:
                  return set(
                      json.loads(
                          STATE_FILE.read_text()
                      )
                  )
              except:
                  return set()

          def save_state(state):
              STATE_FILE.write_text(
                  json.dumps(
                      sorted(list(state))[-5000:],
                      indent=2
                  )
              )

          seen = load_state()

          # =========================================================
          # SEC TICKER DATABASE
          # =========================================================

          ticker_data = json.loads(
              fetch(
                  "https://www.sec.gov/files/company_tickers.json",
                  "www.sec.gov"
              )
          )

          ticker_map = {}

          for item in ticker_data.values():
              ticker = str(
                  item.get("ticker", "")
              ).upper().strip()

              title = str(
                  item.get("title", "")
              ).upper().strip()

              if ticker and title:
                  ticker_map[ticker] = title

          def normalize_name(name):
              name = name.upper()

              name = re.sub(
                  r"\b("
                  r"INC|INCORPORATED|CORP|CORPORATION|"
                  r"LLC|LTD|LIMITED|PLC|CO|COMPANY"
                  r")\b",
                  "",
                  name
              )

              return re.sub(
                  r"[^A-Z0-9]",
                  "",
                  name
              )

          def find_ticker(company):
              target = normalize_name(company)

              if not target:
                  return None

              best = None
              best_score = 0

              for ticker, title in ticker_map.items():

                  candidate = normalize_name(title)

                  if target == candidate:
                      return ticker

                  if (
                      len(target) >= 6
                      and (
                          target in candidate
                          or candidate in target
                      )
                  ):
                      score = min(
                          len(target),
                          len(candidate)
                      )

                      if score > best_score:
                          best_score = score
                          best = ticker

              return best

          # =========================================================
          # TEXT CLEANING
          # =========================================================

          def clean(text):
              text = html.unescape(text or "")
              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )
              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )
              return text.strip()

          # =========================================================
          # CAPITAL FLOW TERMS
          # =========================================================

          capital_terms = [
              "capital expenditure",
              "capital expenditures",
              "capex",
              "construction",
              "data center",
              "data centre",
              "infrastructure",
              "manufacturing facility",
              "production facility",
              "facility expansion",
              "capacity expansion",
              "purchase commitment",
              "supply agreement",
              "long-term supply",
              "contract award",
              "awarded contract",
              "government contract",
              "strategic investment",
              "investment agreement",
              "financing agreement",
              "credit facility",
              "term loan",
              "acquisition",
              "merger",
              "initial public offering",
              "secondary offering",
              "private placement",
              "orders",
              "purchase agreement",
              "investment"
          ]

          beneficiary_terms = [
              "supplier",
              "supplied by",
              "vendor",
              "contractor",
              "contracted",
              "awarded to",
              "selected",
              "partner",
              "technology provider",
              "equipment provider",
              "manufacturer",
              "purchase from",
              "purchased from",
              "orders from",
              "order from",
              "agreement with",
              "contract with"
          ]

          infrastructure_terms = [
              "data center",
              "data centre",
              "power",
              "grid",
              "manufacturing",
              "factory",
              "facility",
              "semiconductor",
              "chip",
              "server",
              "cloud",
              "battery",
              "energy",
              "industrial",
              "infrastructure",
              "ai compute",
              "artificial intelligence",
              "hyperscaler",
              "warehouse"
          ]

          money_pattern = re.compile(
              r"(?i)"
              r"(?:\$|USD\s*)"
              r"\s*\d+(?:\.\d+)?"
              r"\s*(?:billion|million|thousand|bn|mm|m|k)"
          )

          def signal_score(text):
              lower = text.lower()

              cap = sum(
                  1 for x in capital_terms
                  if x in lower
              )

              infra = sum(
                  1 for x in infrastructure_terms
                  if x in lower
              )

              ben = sum(
                  1 for x in beneficiary_terms
                  if x in lower
              )

              money = len(
                  money_pattern.findall(text)
              )

              return min(
                  100,
                  min(cap * 6, 24)
                  + min(infra * 4, 20)
                  + min(ben * 6, 24)
                  + min(money * 16, 32)
              )

          # =========================================================
          # MONEY
          # =========================================================

          def money_value(text):

              values = []

              for match in money_pattern.findall(text):

                  number = re.search(
                      r"\d+(?:\.\d+)?",
                      match
                  )

                  if not number:
                      continue

                  value = float(
                      number.group()
                  )

                  upper = match.upper()

                  if (
                      "BILLION" in upper
                      or "BN" in upper
                  ):
                      value *= 1_000_000_000

                  elif (
                      "MILLION" in upper
                      or "MM" in upper
                  ):
                      value *= 1_000_000

                  elif (
                      "THOUSAND" in upper
                      or "K" in upper
                  ):
                      value *= 1_000

                  values.append(value)

              return max(values) if values else 0

          def money_display(value):

              if value >= 1_000_000_000:
                  return (
                      f"${value / 1_000_000_000:.2f}B"
                  )

              if value >= 1_000_000:
                  return (
                      f"${value / 1_000_000:.1f}M"
                  )

              if value >= 1_000:
                  return (
                      f"${value / 1_000:.0f}K"
                  )

              return "Not clearly detected"

          # =========================================================
          # EVIDENCE
          # =========================================================

          def get_evidence(text):

              sentences = re.split(
                  r"(?<=[.!?])\s+",
                  text
              )

              results = []

              for sentence in sentences:

                  lower = sentence.lower()

                  if any(
                      term in lower
                      for term in beneficiary_terms
                  ):

                      sentence = sentence.strip()

                      if len(sentence) >= 60:
                          results.append(
                              sentence[:600]
                          )

                  if len(results) >= 4:
                      break

              return results

          # =========================================================
          # EXTRACT POSSIBLE COMPANY NAMES
          # =========================================================

          company_suffixes = (
              "Inc.",
              "Inc",
              "Corp.",
              "Corporation",
              "Ltd.",
              "Limited",
              "PLC",
              "LLC",
              "Company",
              "Co."
          )

          def beneficiary_tickers(text):

              found = []

              # Look for capitalized company names
              pattern = re.compile(
                  r"\b"
                  r"([A-Z][A-Za-z0-9&.-]+"
                  r"(?:\s+[A-Z][A-Za-z0-9&.-]+){0,5}"
                  r"\s+(?:Inc\.?|Corp\.?|Corporation|"
                  r"Ltd\.?|Limited|PLC|LLC|Company|Co\.))"
              )

              for match in pattern.findall(text):

                  ticker = find_ticker(match)

                  if (
                      ticker
                      and ticker not in found
                  ):
                      found.append(ticker)

                  if len(found) >= 5:
                      break

              return found

          # =========================================================
          # PRICE / MARKET REPRICING
          # =========================================================

          def get_price(ticker):

              try:

                  url = (
                      "https://query1.finance.yahoo.com/"
                      "v8/finance/chart/"
                      + urllib.parse.quote(ticker)
                      + "?range=5d&interval=1d"
                  )

                  data = json.loads(
                      fetch(url)
                  )

                  result = (
                      data["chart"]["result"][0]
                  )

                  closes = (
                      result["indicators"]
                      ["quote"][0]["close"]
                  )

                  closes = [
                      float(x)
                      for x in closes
                      if x is not None
                  ]

                  if len(closes) < 2:
                      return None

                  current = closes[-1]
                  previous = closes[-2]

                  one_day = (
                      (current - previous)
                      / previous
                      * 100
                  )

                  five_day = None

                  if len(closes) >= 5:

                      start = closes[0]

                      five_day = (
                          (current - start)
                          / start
                          * 100
                      )

                  return {
                      "price": current,
                      "one_day": one_day,
                      "five_day": five_day
                  }

              except Exception as e:

                  print(
                      "Price lookup failed:",
                      ticker,
                      e
                  )

                  return None

          def repricing(price):

              if not price:
                  return "UNKNOWN"

              move = price["one_day"]

              if move >= 10:
                  return "HEAVILY REPRICED"

              if move >= 5:
                  return "STRONGLY REPRICED"

              if move >= 2:
                  return "PARTIALLY REPRICED"

              if move <= -5:
                  return "NEGATIVE REACTION"

              return "LITTLE / NO REPRICING"

          # =========================================================
          # GDELT NEWS
          # =========================================================

          news_queries = [
              '"capital expenditure" OR capex',
              '"data center" OR "data centre"',
              '"contract award" OR "awarded contract"',
              '"supply agreement" OR "purchase agreement"',
              '"strategic investment" OR "investment agreement"',
              '"manufacturing facility" OR "factory expansion"',
              '"infrastructure investment"',
              '"AI infrastructure" OR "AI compute"',
              '"billion contract" OR "billion investment"',
              '"million contract" OR "million investment"'
          ]

          def gdelt_articles(query):

              encoded = urllib.parse.quote(
                  f"({query})"
              )

              url = (
                  "https://api.gdeltproject.org/"
                  "api/v2/doc/doc?"
                  f"query={encoded}"
                  "&mode=artlist"
                  "&maxrecords=50"
                  "&timespan=24h"
                  "&sort=datedesc"
                  "&format=json"
              )

              try:

                  data = json.loads(
                      fetch(url)
                  )

                  return data.get(
                      "articles",
                      []
                  )

              except Exception as e:

                  print(
                      "GDELT error:",
                      e
                  )

                  return []

          news_candidates = {}

          for query in news_queries:

              for article in gdelt_articles(
                  query
              ):

                  title = clean(
                      article.get(
                          "title",
                          ""
                      )
                  )

                  url = article.get(
                      "url",
                      ""
                  )

                  published = article.get(
                      "seendate",
                      ""
                  )

                  if not title or not url:
                      continue

                  article_id = (
                      "NEWS:" + url
                  )

                  if article_id in seen:
                      continue

                  # Fetch article where possible
                  try:
                      body = clean(
                          fetch(url)
                      )
                  except:
                      body = ""

                  combined = (
                      title + " " + body
                  )

                  score = signal_score(
                      combined
                  )

                  if score < 45:
                      continue

                  existing = news_candidates.get(
                      article_id
                  )

                  candidate = {
                      "id": article_id,
                      "source": "NEWS",
                      "form": "NEWS",
                      "company": title,
                      "ticker": None,
                      "title": title,
                      "url": url,
                      "updated": published,
                      "score": score,
                      "money": money_value(
                          combined
                      ),
                      "evidence": get_evidence(
                          combined
                      ),
                      "beneficiaries":
                          beneficiary_tickers(
                              combined
                          )
                  }

                  if (
                      existing is None
                      or candidate["score"]
                      > existing["score"]
                  ):
                      news_candidates[
                          article_id
                      ] = candidate

          # =========================================================
          # SEC FEEDS
          # =========================================================

          sec_feeds = [
              (
                  "8-K",
                  "https://www.sec.gov/cgi-bin/"
                  "browse-edgar?action=getcurrent"
                  "&type=8-K&company=&dateb="
                  "&owner=exclude&count=100"
                  "&output=atom"
              ),
              (
                  "6-K",
                  "https://www.sec.gov/cgi-bin/"
                  "browse-edgar?action=getcurrent"
                  "&type=6-K&company=&dateb="
                  "&owner=exclude&count=100"
                  "&output=atom"
              ),
              (
                  "S-1",
                  "https://www.sec.gov/cgi-bin/"
                  "browse-edgar?action=getcurrent"
                  "&type=S-1&company=&dateb="
                  "&owner=exclude&count=100"
                  "&output=atom"
              ),
              (
                  "S-3",
                  "https://www.sec.gov/cgi-bin/"
                  "browse-edgar?action=getcurrent"
                  "&type=S-3&company=&dateb="
                  "&owner=exclude&count=100"
                  "&output=atom"
              ),
              (
                  "424B4",
                  "https://www.sec.gov/cgi-bin/"
                  "browse-edgar?action=getcurrent"
                  "&type=424B4&company=&dateb="
                  "&owner=exclude&count=100"
                  "&output=atom"
              )
          ]

          sec_candidates = []

          now = datetime.now(
              timezone.utc
          )

          for form, feed in sec_feeds:

              try:

                  raw = fetch(
                      feed,
                      "www.sec.gov"
                  )

                  root = ET.fromstring(
                      raw
                  )

                  ns = {
                      "atom":
                      "http://www.w3.org/2005/Atom"
                  }

                  entries = root.findall(
                      "atom:entry",
                      ns
                  )

                  for entry in entries:

                      title = entry.findtext(
                          "atom:title",
                          "",
                          ns
                      )

                      updated = entry.findtext(
                          "atom:updated",
                          "",
                          ns
                      )

                      accession = entry.findtext(
                          "atom:id",
                          "",
                          ns
                      )

                      link_node = entry.find(
                          "atom:link",
                          ns
                      )

                      if link_node is None:
                          continue

                      url = link_node.attrib.get(
                          "href",
                          ""
                      )

                      uid = (
                          accession or url
                      )

                      if uid in seen:
                          continue

                      try:

                          dt = datetime.fromisoformat(
                              updated.replace(
                                  "Z",
                                  "+00:00"
                              )
                          )

                          if (
                              now - dt
                              > timedelta(hours=24)
                          ):
                              continue

                      except:
                          pass

                      try:
                          filing = clean(
                              fetch(
                                  url,
                                  "www.sec.gov"
                              )
                          )
                      except:
                          filing = ""

                      combined = (
                          title + " " + filing
                      )

                      score = signal_score(
                          combined
                      )

                      if score < 45:
                          continue

                      match = re.search(
                          r"(?:8-K|6-K|S-1|S-3|424B4?)"
                          r"\s*-\s*(.*?)\s*\(\d+\)",
                          title,
                          re.I
                      )

                      if match:
                          company = (
                              match.group(1)
                              .strip()
                          )
                      else:
                          company = title

                      ticker = find_ticker(
                          company
                      )

                      sec_candidates.append({
                          "id": uid,
                          "source": "SEC",
                          "form": form,
                          "company": company,
                          "ticker": ticker,
                          "title": title,
                          "url": url,
                          "updated": updated,
                          "score": score,
                          "money":
                              money_value(
                                  combined
                              ),
                          "evidence":
                              get_evidence(
                                  combined
                              ),
                          "beneficiaries":
                              beneficiary_tickers(
                                  combined
                              )
                      })

                  except Exception as e:

                      print(
                          f"SEC feed error {form}:",
                          e
                      )

          # =========================================================
          # COMBINE
          # =========================================================

          all_candidates = (
              sec_candidates
              + list(
                  news_candidates.values()
              )
          )

          # Remove duplicates by URL/title
          unique = {}

          for item in all_candidates:

              key = (
                  item["url"]
                  or item["title"]
              )

              existing = unique.get(key)

              if (
                  existing is None
                  or item["score"]
                  > existing["score"]
              ):
                  unique[key] = item

          all_candidates = list(
              unique.values()
          )

          # Highest capital-flow signals first
          all_candidates.sort(
              key=lambda x: (
                  x["score"],
                  x["money"]
              ),
              reverse=True
          )

          # Keep Telegram manageable
          all_candidates = all_candidates[:10]

          # =========================================================
          # ALERT GENERATION
          # =========================================================

          for item in all_candidates:

              ticker = (
                  item["ticker"]
                  or "NOT IDENTIFIED"
              )

              price = None

              if (
                  ticker != "NOT IDENTIFIED"
                  and len(ticker) <= 5
              ):
                  price = get_price(
                      ticker
                  )

              # Check named beneficiary tickers too
              beneficiary_prices = []

              for bt in item.get(
                  "beneficiaries",
                  []
              )[:5]:

                  bp = get_price(bt)

                  if bp:
                      beneficiary_prices.append(
                          (
                              bt,
                              bp
                          )
                      )

              status = repricing(
                  price
              )

              # -----------------------------------------------------
              # ALPHA SCORE
              # -----------------------------------------------------

              alpha = item["score"]

              if item["money"] >= 1_000_000_000:
                  alpha += 8
              elif item["money"] >= 250_000_000:
                  alpha += 5
              elif item["money"] >= 50_000_000:
                  alpha += 3

              if item["evidence"]:
                  alpha += 7

              if item.get(
                  "beneficiaries"
              ):
                  alpha += 5

              if status == (
                  "LITTLE / NO REPRICING"
              ):
                  alpha += 5

              elif status == (
                  "PARTIALLY REPRICED"
              ):
                  alpha += 2

              alpha = min(
                  alpha,
                  100
              )

              # -----------------------------------------------------
              # FIRST MOVER
              # -----------------------------------------------------

              if status == (
                  "LITTLE / NO REPRICING"
              ):

                  first_mover = (
                      "🟢 POTENTIAL FIRST-MOVER WINDOW"
                  )

              elif status == (
                  "PARTIALLY REPRICED"
              ):

                  first_mover = (
                      "🟡 PARTIALLY REPRICED"
                  )

              elif status in (
                  "STRONGLY REPRICED",
                  "HEAVILY REPRICED"
              ):

                  first_mover = (
                      "🔴 ALREADY SIGNIFICANTLY REPRICED"
                  )

              else:

                  first_mover = (
                      "⚪ REPRICING UNKNOWN"
                  )

              # -----------------------------------------------------
              # PRICE TEXT
              # -----------------------------------------------------

              if price:

                  price_text = (
                      f"${price['price']:.2f}"
                  )

                  day_text = (
                      f"{price['one_day']:+.2f}%"
                  )

                  if price["five_day"] is not None:
                      five_text = (
                          f"{price['five_day']:+.2f}%"
                      )
                  else:
                      five_text = "N/A"

              else:

                  price_text = "Unavailable"
                  day_text = "N/A"
                  five_text = "N/A"

              # -----------------------------------------------------
              # BENEFICIARY CLASSIFICATION
              # -----------------------------------------------------

              if item.get(
                  "beneficiaries"
              ):

                  beneficiary_text = (
                      "DIRECT/INDIRECT CANDIDATES:\n"
                      + "\n".join(
                          "• " + x
                          for x in item[
                              "beneficiaries"
                          ][:5]
                      )
                  )

                  beneficiary_warning = (
                      "⚠️ Candidate identification "
                      "requires confirmation from the "
                      "underlying announcement."
                  )

              elif item["evidence"]:

                  beneficiary_text = (
                      "BENEFICIARY EVIDENCE FOUND"
                  )

                  beneficiary_warning = (
                      "⚠️ Named beneficiary could not "
                      "be reliably mapped to a public ticker."
                  )

              else:

                  beneficiary_text = (
                      "No reliable beneficiary identified."
                  )

                  beneficiary_warning = (
                      "⚠️ Treat industry exposure as "
                      "speculative until confirmed."
                  )

              # -----------------------------------------------------
              # BAMBOO
              # -----------------------------------------------------

              bamboo = (
                  "CHECK REQUIRED — automated Bamboo "
                  "execution verification is not available."
              )

              # -----------------------------------------------------
              # ENTRY / EXIT FRAMEWORK
              # -----------------------------------------------------

              if status == (
                  "LITTLE / NO REPRICING"
              ):

                  entry = (
                      "Wait for confirmation of the catalyst "
                      "and a controlled breakout/retest. "
                      "Do not chase the headline spike."
                  )

                  exit = (
                      "Reassess if the catalyst is weakened, "
                      "cancelled or contradicted. For a trading "
                      "position, consider partial profit-taking "
                      "into strong extension and protect against "
                      "loss of the catalyst reaction low."
                  )

              elif status == (
                  "PARTIALLY REPRICED"
              ):

                  entry = (
                      "Avoid chasing the initial move. "
                      "Look for a pullback/retest followed by "
                      "renewed volume and confirmation."
                  )

                  exit = (
                      "Reassess on failure of the retest or "
                      "material deterioration of the catalyst. "
                      "Consider partial profit-taking if the "
                      "stock makes a sharp extension."
                  )

              elif status in (
                  "STRONGLY REPRICED",
                  "HEAVILY REPRICED"
              ):

                  entry = (
                      "The initial catalyst appears substantially "
                      "reflected in price. Require a fresh catalyst "
                      "or a technically confirmed setup rather "
                      "than chasing the original announcement."
                  )

                  exit = (
                      "The original announcement should no longer "
                      "be treated as the sole reason to remain in "
                      "the position."
                  )

              else:

                  entry = (
                      "Market data must be verified before using "
                      "an entry trigger."
                  )

                  exit = (
                      "Market data must be verified before using "
                      "an exit trigger."
                  )

              # -----------------------------------------------------
              # BENEFICIARY PRICE TABLE
              # -----------------------------------------------------

              if beneficiary_prices:

                  bp_text = "\n".join(
                      f"• {bt}: "
                      f"${bp['price']:.2f} "
                      f"({bp['one_day']:+.2f}%)"
                      for bt, bp
                      in beneficiary_prices
                  )

              else:

                  bp_text = (
                      "No beneficiary price confirmed."
                  )

              # -----------------------------------------------------
              # EVIDENCE
              # -----------------------------------------------------

