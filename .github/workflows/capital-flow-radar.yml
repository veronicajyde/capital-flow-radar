name: Capital Flow Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Test SEC API
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          # SEC API
          sec_url = "https://data.sec.gov/submissions/CIK0000320193.json"

          request = urllib.request.Request(
              sec_url,
              headers={
                  "User-Agent": "Capital Flow Radar veronicajyde@gmail.com",
                  "Accept-Encoding": "gzip, deflate"
              }
          )

          try:
              response = urllib.request.urlopen(
                  request,
                  timeout=30
              )

              data = json.loads(
                  response.read().decode()
              )

              print("SEC API connection successful.")
              print("Company:", data["name"])
              print(
                  "Recent filings:",
                  len(data["filings"]["recent"]["form"])
              )

          except urllib.error.HTTPError as e:
              print("SEC ERROR:")
              print(e.read().decode())
              raise

          # Telegram
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          telegram_url = (
              f"https://api.telegram.org/bot{token}/sendMessage"
          )

          payload = json.dumps({
              "chat_id": chat_id,
              "text": (
                  "🟢 CAPITAL FLOW RADAR\n\n"
                  "SEC API connection successful.\n\n"
                  "Real-time filing pipeline is ready."
              )
          }).encode()

          telegram_request = urllib.request.Request(
              telegram_url,
              data=payload,
              headers={
                  "Content-Type": "application/json"
              }
          )

          try:
              telegram_response = urllib.request.urlopen(
                  telegram_request,
                  timeout=30
              )

              print(
                  telegram_response.read().decode()
              )

          except urllib.error.HTTPError as e:
              print("TELEGRAM ERROR:")
              print(e.read().decode())
              raise

          PY
