name: Capital Flow Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Capital Flow Beneficiary Detector
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import gzip
          import re
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from html import unescape
          from datetime import datetime, timezone

          USER_AGENT = "Capital Flow Radar veronicajyde@gmail.com"

          HEADERS = {
              "User-Agent": USER_AGENT,
              "Accept-Encoding": "gzip, deflate",
              "Accept": "text/html,application/xml,text/xml"
          }

          RSS_URL = (
              "https://www.sec.gov/cgi-bin/browse-edgar"
              "?action=getcurrent"
              "&type=8-K"
              "&company="
              "&dateb="
              "&owner=exclude"
              "&count=100"
              "&output=atom"
          )

          # --------------------------------------------------
          # HTTP
          # --------------------------------------------------

          def get_url(url):

              request = urllib.request.Request(
                  url,
                  headers=HEADERS
              )

              response = urllib.request.urlopen(
                  request,
                  timeout=30
              )

              raw = response.read()

              if response.headers.get(
                  "Content-Encoding"
              ) == "gzip":
                  raw = gzip.decompress(raw)

              return raw

          # --------------------------------------------------
          # CLEAN HTML
          # --------------------------------------------------

          def clean_html(text):

              text = unescape(text or "")
              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()

          # --------------------------------------------------
          # CAPITAL SIGNALS
          # --------------------------------------------------

          capital_terms = [
              "capital expenditure",
              "capital expenditures",
              "capex",
              "construction",
              "data center",
              "data centre",
              "infrastructure",
              "manufacturing facility",
              "production facility",
              "new facility",
              "facility expansion",
              "capacity expansion",
              "purchase commitment",
              "supply agreement",
              "long-term supply",
              "contract award",
              "awarded contract",
              "government contract",
              "strategic investment",
              "investment agreement",
              "financing agreement",
              "credit facility",
              "term loan",
              "acquisition",
              "merger",
              "offering"
          ]

          beneficiary_terms = [
              "supplier",
              "supplied by",
              "supply",
              "vendor",
              "contractor",
              "contracted",
              "awarded to",
              "selected",
              "partner",
              "technology provider",
              "equipment provider",
              "manufacturer",
              "purchase from",
              "purchased from",
              "orders from",
              "order from",
              "agreement with"
          ]

          money_pattern = re.compile(
              r"""
              (?:
                  \$\s?
                  |
                  USD\s?
              )
              \d+(?:,\d{3})*(?:\.\d+)?
              \s?
              (?:billion|million|thousand|bn|mm|m|k)?
              """,
              re.IGNORECASE | re.VERBOSE
          )

          # --------------------------------------------------
          # GET RSS
          # --------------------------------------------------

          raw = get_url(RSS_URL)

          root = ET.fromstring(raw)

          ns = {
              "atom": "http://www.w3.org/2005/Atom"
          }

          entries = root.findall(
              "atom:entry",
              ns
          )

          print(
              "SEC filings retrieved:",
              len(entries)
          )

          candidates = []

          # --------------------------------------------------
          # INITIAL FILTER
          # --------------------------------------------------

          for entry in entries:

              title = entry.findtext(
                  "atom:title",
                  "",
                  ns
              ).strip()

              summary = entry.findtext(
                  "atom:summary",
                  "",
                  ns
              ).strip()

              published = entry.findtext(
                  "atom:updated",
                  "",
                  ns
              ).strip()

              link_element = entry.find(
                  "atom:link",
                  ns
              )

              link = ""

              if link_element is not None:
                  link = link_element.attrib.get(
                      "href",
                      ""
                  )

              summary_clean = clean_html(
                  summary
              )

              combined = (
                  title + " " +
                  summary_clean
              ).lower()

              matched_capital = [
                  x for x in capital_terms
                  if x in combined
              ]

              if not matched_capital:
                  continue

              score = 0

              score += min(
                  len(matched_capital) * 10,
                  40
              )

              money = money_pattern.findall(
                  combined
              )

              if money:
                  score += 25

              if any(
                  x in combined
                  for x in [
                      "data center",
                      "data centre",
                      "infrastructure",
                      "construction",
                      "manufacturing facility",
                      "capacity expansion"
                  ]
              ):
                  score += 20

              if any(
                  x in combined
                  for x in [
                      "supply agreement",
                      "contract award",
                      "awarded contract",
                      "purchase commitment"
                  ]
              ):
                  score += 15

              if score < 40:
                  continue

              candidates.append({
                  "title": title,
                  "summary": summary_clean,
                  "published": published,
                  "link": link,
                  "capital_signals": matched_capital,
                  "money": money,
                  "score": min(score, 100)
              })

          candidates = candidates[:5]

          print(
              "Qualified candidates:",
              len(candidates)
          )

          # --------------------------------------------------
          # RETRIEVE FILINGS
          # --------------------------------------------------

          analyzed = []

          for item in candidates:

              filing_text = ""

              try:

                  if item["link"]:

                      filing_raw = get_url(
                          item["link"]
                      )

                      filing_text = clean_html(
                          filing_raw.decode(
                              "utf-8",
                              errors="replace"
                          )
                      )

              except Exception as e:

                  print(
                      "Could not retrieve filing:",
                      e
                  )

              # Limit text for processing
              filing_text = filing_text[:50000]

              lower_text = filing_text.lower()

              beneficiary_hits = []

              for term in beneficiary_terms:

                  if term in lower_text:
                      beneficiary_hits.append(
                          term
                      )

              # ------------------------------------------------
              # FIND SENTENCES AROUND BENEFICIARY LANGUAGE
              # ------------------------------------------------

              evidence = []

              sentences = re.split(
                  r"(?<=[.!?])\s+",
                  filing_text
              )

              for sentence in sentences:

                  s_lower = sentence.lower()

                  if any(
                      term in s_lower
                      for term in beneficiary_terms
                  ):

                      if (
                          len(sentence) > 50
                          and len(sentence) < 1000
                      ):
                          evidence.append(
                              sentence.strip()
                          )

                  if len(evidence) >= 3:
                      break

              # ------------------------------------------------
              # FIND MONEY REFERENCES
              # ------------------------------------------------

              filing_money = money_pattern.findall(
                  filing_text
              )

              item["beneficiary_language"] = (
                  beneficiary_hits[:8]
              )

              item["evidence"] = evidence

              item["filing_money"] = (
                  filing_money[:10]
              )

              analyzed.append(item)

          # --------------------------------------------------
          # TELEGRAM
          # --------------------------------------------------

          if not analyzed:

              print(
                  "No capital-flow events found."
              )

              raise SystemExit(0)

          lines = [
              "🚨 CAPITAL FLOW RADAR",
              "",
              "NEW CAPITAL-FLOW EVENT",
              ""
          ]

          for item in analyzed:

              lines.append(
                  f"📊 SIGNAL SCORE: {item['score']}/100"
              )

              lines.append(
                  f"📄 {item['title']}"
              )

              if item["money"]:

                  lines.append(
                      "💰 Amount: " +
                      ", ".join(
                          item["money"][:5]
                      )
                  )

              if item["beneficiary_language"]:

                  lines.append(
                      "🏢 Beneficiary language: " +
                      ", ".join(
                          item[
                              "beneficiary_language"
                          ]
                      )
                  )

              if item["evidence"]:

                  lines.append(
                      "🔎 Evidence:"
                  )

                  for evidence in item[
                      "evidence"
                  ]:

                      lines.append(
                          "• " +
                          evidence[:500]
                      )

              lines.append(
                  "🕐 " +
                  item["published"]
              )

              if item["link"]:

                  lines.append(
                      "🔗 " +
                      item["link"]
                  )

              lines.append("")

          lines.append(
              "⚠️ BENEFICIARY STATUS"
          )

          lines.append(
              "The system has identified "
              "beneficiary evidence, but has "
              "NOT yet verified the beneficiary "
              "as a publicly traded Bamboo asset."
          )

          lines.append("")

          lines.append(
              "NEXT: ticker verification → "
              "Bamboo availability → "
              "price movement → "
              "Alpha Score → entry/exit plan"
          )

          message = "\n".join(lines)

          token = os.environ[
              "TELEGRAM_BOT_TOKEN"
          ]

          chat_id = os.environ[
              "TELEGRAM_CHAT_ID"
          ]

          telegram_url = (
              f"https://api.telegram.org/"
              f"bot{token}/sendMessage"
          )

          payload = json.dumps({
              "chat_id": chat_id,
              "text": message,
              "disable_web_page_preview": True
          }).encode("utf-8")

          telegram_request = urllib.request.Request(
              telegram_url,
              data=payload,
              headers={
                  "Content-Type": "application/json"
              }
          )

          response = urllib.request.urlopen(
              telegram_request,
              timeout=30
          )

          print(
              response.read().decode("utf-8")
          )

          PY
