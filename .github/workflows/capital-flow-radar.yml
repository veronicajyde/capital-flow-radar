name: Capital Flow Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Scan SEC filings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import gzip
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          USER_AGENT = "Capital Flow Radar veronicajyde@gmail.com"

          # SEC EDGAR Latest Filings RSS
          RSS_URL = "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=8-K&company=&dateb=&owner=exclude&count=100&output=atom"

          headers = {
              "User-Agent": USER_AGENT,
              "Accept-Encoding": "gzip, deflate",
              "Accept": "application/atom+xml,application/xml,text/xml"
          }

          request = urllib.request.Request(
              RSS_URL,
              headers=headers
          )

          response = urllib.request.urlopen(
              request,
              timeout=30
          )

          raw = response.read()

          if response.headers.get("Content-Encoding") == "gzip":
              raw = gzip.decompress(raw)

          root = ET.fromstring(raw)

          # Atom namespace
          ns = {
              "atom": "http://www.w3.org/2005/Atom"
          }

          entries = root.findall("atom:entry", ns)

          print("SEC connection successful.")
          print("Filings retrieved:", len(entries))

          # Capital-flow keywords
          keywords = [
              "capital expenditure",
              "capital expenditures",
              "capex",
              "construction",
              "data center",
              "data centre",
              "infrastructure",
              "expansion",
              "facility",
              "facilities",
              "manufacturing",
              "production capacity",
              "purchase commitment",
              "supply agreement",
              "definitive agreement",
              "material agreement",
              "contract",
              "award",
              "financing",
              "credit facility",
              "acquisition",
              "merger",
              "offering",
              "public offering",
              "private placement",
              "proceeds",
              "investment"
          ]

          target_forms = {
              "8-K",
              "S-1",
              "S-3",
              "424B1",
              "424B2",
              "424B3",
              "424B4",
              "424B5",
              "6-K"
          }

          candidates = []

          for entry in entries:

              title = entry.findtext(
                  "atom:title",
                  "",
                  ns
              ).strip()

              summary = entry.findtext(
                  "atom:summary",
                  "",
                  ns
              ).strip()

              published = entry.findtext(
                  "atom:updated",
                  "",
                  ns
              ).strip()

              link = ""

              link_element = entry.find(
                  "atom:link",
                  ns
              )

              if link_element is not None:
                  link = link_element.attrib.get(
                      "href",
                      ""
                  )

              text = (
                  title + " " +
                  summary
              ).lower()

              matched = [
                  word for word in keywords
                  if word in text
              ]

              if matched:
                  candidates.append({
                      "title": title,
                      "published": published,
                      "link": link,
                      "matches": matched[:5]
                  })

          print(
              "Potential capital-flow filings:",
              len(candidates)
          )

          # Send only the most relevant candidates
          candidates = candidates[:5]

          if candidates:

              lines = [
                  "🚨 CAPITAL FLOW RADAR",
                  "",
                  "NEW SEC CAPITAL-FLOW SIGNAL",
                  ""
              ]

              for item in candidates:

                  lines.append(
                      f"📄 {item['title']}"
                  )

                  lines.append(
                      f"🔎 Signals: {', '.join(item['matches'])}"
                  )

                  if item["published"]:
                      lines.append(
                          f"🕐 {item['published']}"
                      )

                  if item["link"]:
                      lines.append(
                          f"🔗 {item['link']}"
                      )

                  lines.append("")

              message = "\n".join(lines)

          else:

              message = (
                  "🟢 CAPITAL FLOW RADAR\n\n"
                  "SEC scan completed.\n\n"
                  "No new capital-flow candidates "
                  "detected in this scan."
              )

          # Telegram
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          telegram_url = (
              f"https://api.telegram.org/bot{token}/sendMessage"
          )

          payload = json.dumps({
              "chat_id": chat_id,
              "text": message,
              "disable_web_page_preview": True
          }).encode("utf-8")

          telegram_request = urllib.request.Request(
              telegram_url,
              data=payload,
              headers={
                  "Content-Type": "application/json"
              }
          )

          telegram_response = urllib.request.urlopen(
              telegram_request,
              timeout=30
          )

          print(
              telegram_response.read().decode("utf-8")
          )

          PY
