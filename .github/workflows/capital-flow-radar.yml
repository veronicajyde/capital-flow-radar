name: Capital Flow Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Capital Flow Market Analyzer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import gzip
          import re
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from html import unescape
          from datetime import datetime, timezone

          USER_AGENT = "Capital Flow Radar veronicajyde@gmail.com"

          HEADERS = {
              "User-Agent": USER_AGENT,
              "Accept-Encoding": "gzip, deflate",
              "Accept": "text/html,application/xml,text/xml"
          }

          RSS_URL = (
              "https://www.sec.gov/cgi-bin/browse-edgar"
              "?action=getcurrent"
              "&type=8-K"
              "&company="
              "&dateb="
              "&owner=exclude"
              "&count=100"
              "&output=atom"
          )

          def get_url(url):

              request = urllib.request.Request(
                  url,
                  headers=HEADERS
              )

              response = urllib.request.urlopen(
                  request,
                  timeout=30
              )

              raw = response.read()

              if response.headers.get(
                  "Content-Encoding"
              ) == "gzip":

                  raw = gzip.decompress(raw)

              return raw

          def clean_html(text):

              text = unescape(text or "")

              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()

          # --------------------------------------------------
          # CAPITAL FLOW TERMS
          # --------------------------------------------------

          capital_terms = [
              "capital expenditure",
              "capital expenditures",
              "capex",
              "construction",
              "data center",
              "data centre",
              "infrastructure",
              "manufacturing facility",
              "production facility",
              "facility expansion",
              "capacity expansion",
              "purchase commitment",
              "supply agreement",
              "long-term supply",
              "contract award",
              "awarded contract",
              "government contract",
              "strategic investment",
              "investment agreement",
              "financing agreement",
              "credit facility",
              "acquisition",
              "merger",
              "offering"
          ]

          beneficiary_terms = [
              "supplier",
              "supplied by",
              "vendor",
              "contractor",
              "contracted",
              "awarded to",
              "selected",
              "partner",
              "technology provider",
              "equipment provider",
              "manufacturer",
              "purchase from",
              "purchased from",
              "orders from",
              "order from",
              "agreement with"
          ]

          money_pattern = re.compile(
              r"""
              (?:
                  \$\s?
                  |
                  USD\s?
              )
              \d+(?:,\d{3})*(?:\.\d+)?
              \s?
              (?:billion|million|thousand|bn|mm|m|k)?
              """,
              re.IGNORECASE | re.VERBOSE
          )

          ticker_pattern = re.compile(
              r"\b[A-Z]{1,5}\b"
          )

          # --------------------------------------------------
          # SEC
          # --------------------------------------------------

          raw = get_url(RSS_URL)

          root = ET.fromstring(raw)

          ns = {
              "atom": "http://www.w3.org/2005/Atom"
          }

          entries = root.findall(
              "atom:entry",
              ns
          )

          print(
              "SEC filings:",
              len(entries)
          )

          candidates = []

          for entry in entries:

              title = entry.findtext(
                  "atom:title",
                  "",
                  ns
              ).strip()

              summary = entry.findtext(
                  "atom:summary",
                  "",
                  ns
              ).strip()

              published = entry.findtext(
                  "atom:updated",
                  "",
                  ns
              ).strip()

              link_element = entry.find(
                  "atom:link",
                  ns
              )

              link = ""

              if link_element is not None:

                  link = link_element.attrib.get(
                      "href",
                      ""
                  )

              summary_clean = clean_html(
                  summary
              )

              combined = (
                  title +
                  " " +
                  summary_clean
              )

              lower = combined.lower()

              matched = [
                  term
                  for term in capital_terms
                  if term in lower
              ]

              if not matched:
                  continue

              score = min(
                  len(matched) * 10,
                  40
              )

              money = money_pattern.findall(
                  combined
              )

              if money:
                  score += 25

              if any(
                  x in lower
                  for x in [
                      "data center",
                      "data centre",
                      "infrastructure",
                      "construction",
                      "manufacturing facility",
                      "capacity expansion"
                  ]
              ):
                  score += 20

              if any(
                  x in lower
                  for x in [
                      "supply agreement",
                      "contract award",
                      "awarded contract",
                      "purchase commitment"
                  ]
              ):
                  score += 15

              if score < 40:
                  continue

              candidates.append({
                  "title": title,
                  "summary": summary_clean,
                  "published": published,
                  "link": link,
                  "score": min(score, 100),
                  "money": money
              })

          candidates = candidates[:5]

          # --------------------------------------------------
          # ANALYZE FILING CONTENT
          # --------------------------------------------------

          results = []

          for item in candidates:

              text = ""

              try:

                  raw_filing = get_url(
                      item["link"]
                  )

                  text = clean_html(
                      raw_filing.decode(
                          "utf-8",
                          errors="replace"
                      )
                  )

              except Exception as e:

                  print(
                      "Filing retrieval error:",
                      e
                  )

              text = text[:100000]

              lower = text.lower()

              evidence = []

              sentences = re.split(
                  r"(?<=[.!?])\s+",
                  text
              )

              for sentence in sentences:

                  s = sentence.lower()

                  if any(
                      term in s
                      for term in beneficiary_terms
                  ):

                      if (
                          60 <= len(sentence) <= 1000
                      ):

                          evidence.append(
                              sentence.strip()
                          )

                  if len(evidence) >= 5:
                      break

              # ----------------------------------------------
              # TICKER CANDIDATES
              # ----------------------------------------------

              possible_tickers = []

              for ticker in ticker_pattern.findall(
                  text[:50000]
              ):

                  # Remove common English words
                  if ticker in {
                      "THE",
                      "AND",
                      "FOR",
                      "WITH",
                      "FROM",
                      "THIS",
                      "THAT",
                      "COMPANY",
                      "CORP",
                      "INC",
                      "LLC",
                      "SEC",
                      "USD",
                      "NYSE",
                      "NASDAQ"
                  }:
                      continue

                  if ticker not in possible_tickers:
                      possible_tickers.append(
                          ticker
                      )

                  if len(possible_tickers) >= 15:
                      break

              results.append({
                  **item,
                  "evidence": evidence,
                  "ticker_candidates":
                      possible_tickers
              })

          # --------------------------------------------------
          # TELEGRAM
          # --------------------------------------------------

          if not results:
              print(
                  "No qualifying events."
              )
              raise SystemExit(0)

          lines = [
              "🚨 CAPITAL FLOW RADAR",
              "",
              "NEW CAPITAL-FLOW SIGNAL",
              ""
          ]

          for item in results:

              lines.append(
                  f"📊 SIGNAL SCORE: "
                  f"{item['score']}/100"
              )

              lines.append(
                  f"📄 {item['title']}"
              )

              if item["money"]:

                  lines.append(
                      "💰 Capital detected: " +
                      ", ".join(
                          item["money"][:5]
                      )
                  )

              if item["ticker_candidates"]:

                  lines.append(
                      "🎯 Ticker candidates: " +
                      ", ".join(
                          item[
                              "ticker_candidates"
                          ][:10]
                      )
                  )

              if item["evidence"]:

                  lines.append(
                      "🏢 Beneficiary evidence:"
                  )

                  for evidence in item[
                      "evidence"
                  ][:3]:

                      lines.append(
                          "• " +
                          evidence[:450]
                      )

              lines.append(
                  "🕐 " +
                  item["published"]
              )

              lines.append(
                  "🔗 " +
                  item["link"]
              )

              lines.append("")

          lines.append(
              "⚠️ BAMBOO STATUS: "
              "NOT YET VERIFIED"
          )

          lines.append(
              "⚠️ Ticker candidates require "
              "verification before trading."
          )

          lines.append("")

          lines.append(
              "NEXT LAYER:"
          )

          lines.append(
              "Price movement → "
              "repricing → "
              "Bamboo verification → "
              "Alpha Score → "
              "entry/exit framework"
          )

          message = "\n".join(lines)

          token = os.environ[
              "TELEGRAM_BOT_TOKEN"
          ]

          chat_id = os.environ[
              "TELEGRAM_CHAT_ID"
          ]

          telegram_url = (
              f"https://api.telegram.org/"
              f"bot{token}/sendMessage"
          )

          payload = json.dumps({
              "chat_id": chat_id,
              "text": message,
              "disable_web_page_preview": True
          }).encode("utf-8")

          request = urllib.request.Request(
              telegram_url,
              data=payload,
              headers={
                  "Content-Type":
                  "application/json"
              }
          )

          response = urllib.request.urlopen(
              request,
              timeout=30
          )

          print(
              response.read().decode("utf-8")
          )

          PY
