name: Capital Flow Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Test SEC connection
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          sec_url = "https://www.sec.gov/files/company_tickers.json"

          request = urllib.request.Request(
              sec_url,
              headers={
                  "User-Agent": "Capital Flow Radar"
              }
          )

          response = urllib.request.urlopen(request, timeout=30)
          data = json.loads(response.read().decode())

          print("SEC connection successful.")
          print("Companies received:", len(data))

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          telegram_url = f"https://api.telegram.org/bot{token}/sendMessage"

          payload = json.dumps({
              "chat_id": chat_id,
              "text": "🟢 CAPITAL FLOW RADAR\n\nSEC connection successful.\n\nThe announcement-detection pipeline is ready for the next stage."
          }).encode()

          telegram_request = urllib.request.Request(
              telegram_url,
              data=payload,
              headers={
                  "Content-Type": "application/json"
              }
          )

          telegram_response = urllib.request.urlopen(
              telegram_request,
              timeout=30
          )

          print(telegram_response.read().decode())
          PY
