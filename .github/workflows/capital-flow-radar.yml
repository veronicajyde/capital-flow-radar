name: Capital Flow Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Capital Flow Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import gzip
          import html
          import urllib.request
          import urllib.parse
          import urllib.error
          from datetime import datetime, timezone, timedelta

          SEC_UA = "Capital Flow Radar veronicajyde@gmail.com"
          STATE_FILE = "radar_state.json"

          CAPITAL_WORDS = [
              "capital expenditure", "capital expenditures", "capex",
              "investment", "investments", "funding", "financing",
              "contract", "contracts", "agreement", "definitive agreement",
              "purchase commitment", "purchase commitments",
              "orders", "order", "backlog", "capacity expansion",
              "expansion", "data center", "datacenter", "infrastructure",
              "artificial intelligence", " AI ", "cloud infrastructure",
              "semiconductor", "manufacturing facility", "facility",
              "construction", "equipment", "supply agreement",
              "strategic partnership"
          ]

          BENEFICIARY_WORDS = [
              "awarded to", "awarded", "selected", "supplier",
              "supplies", "supply", "contractor", "partner",
              "purchase from", "purchases from", "vendor",
              "equipment provider", "provider", "customer",
              "orders from", "ordered from", "will purchase",
              "will procure", "procure from", "agreement with"
          ]

          INFRA_WORDS = [
              "data center", "datacenter", "power", "grid",
              "transmission", "semiconductor", "chip",
              "manufacturing", "factory", "facility", "capacity",
              "server", "servers", "gpu", "cloud", "infrastructure",
              "construction", "energy", "battery", "network"
          ]

          def fetch(url, headers=None, timeout=20):
              req = urllib.request.Request(url)
              req.add_header("User-Agent", SEC_UA)
              req.add_header("Accept-Encoding", "gzip")
              if headers:
                  for k, v in headers.items():
                      req.add_header(k, v)

              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      data = r.read()
                      if r.headers.get("Content-Encoding", "").lower() == "gzip":
                          data = gzip.decompress(data)
                      return data.decode("utf-8", errors="replace")
              except Exception:
                  return ""

          def clean_text(s):
              s = html.unescape(s or "")
              s = re.sub(r"<[^>]+>", " ", s)
              s = re.sub(r"\s+", " ", s)
              return s.strip()

          def money_values(text):
              results = []

              patterns = [
                  r"\$\s?(\d+(?:\.\d+)?)\s*(billion|bn|million|mn|thousand|k|m)\b",
                  r"(\d+(?:\.\d+)?)\s*(billion|bn|million|mn)\s+(?:dollars|USD)",
              ]

              for pattern in patterns:
                  for m in re.finditer(pattern, text, re.I):
                      try:
                          value = float(m.group(1))
                          unit = m.group(2).lower()

                          if unit in ("billion", "bn"):
                              value *= 1_000_000_000
                          elif unit in ("million", "mn", "m"):
                              value *= 1_000_000
                          elif unit in ("thousand", "k"):
                              value *= 1_000

                          results.append(value)
                      except Exception:
                          pass

              return results

          def money_label(values):
              if not values:
                  return "Not detected"

              largest = max(values)

              if largest >= 1_000_000_000:
                  return f"${largest/1_000_000_000:.2f}B"
              if largest >= 1_000_000:
                  return f"${largest/1_000_000:.1f}M"
              return f"${largest:,.0f}"

          def score_text(text):
              t = " " + text.lower() + " "

              capital_hits = sum(1 for x in CAPITAL_WORDS if x.lower() in t)
              infra_hits = sum(1 for x in INFRA_WORDS if x.lower() in t)
              beneficiary_hits = sum(1 for x in BENEFICIARY_WORDS if x.lower() in t)

              amounts = money_values(text)

              score = 0

              if amounts:
                  largest = max(amounts)
                  if largest >= 10_000_000_000:
                      score += 35
                  elif largest >= 1_000_000_000:
                      score += 30
                  elif largest >= 500_000_000:
                      score += 25
                  elif largest >= 100_000_000:
                      score += 18
                  elif largest >= 25_000_000:
                      score += 10
                  else:
                      score += 5

              score += min(capital_hits * 3, 15)
              score += min(infra_hits * 4, 20)
              score += min(beneficiary_hits * 5, 20)

              return min(score, 100), amounts, beneficiary_hits

          def parse_atom(feed):
              entries = re.findall(r"<entry>(.*?)</entry>", feed, re.S | re.I)
              output = []

              for entry in entries:
                  title = re.search(r"<title[^>]*>(.*?)</title>", entry, re.S | re.I)
                  link = re.search(r'<link[^>]+href="([^"]+)"', entry, re.I)
                  updated = re.search(r"<updated>(.*?)</updated>", entry, re.S | re.I)
                  summary = re.search(r"<summary[^>]*>(.*?)</summary>", entry, re.S | re.I)

                  if not title:
                      continue

                  output.append({
                      "title": clean_text(title.group(1)),
                      "link": link.group(1) if link else "",
                      "updated": updated.group(1).strip() if updated else "",
                      "summary": clean_text(summary.group(1)) if summary else ""
                  })

              return output

          def parse_time(value):
              try:
                  value = value.replace("Z", "+00:00")
                  dt = datetime.fromisoformat(value)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc)
              except Exception:
                  return None

          def recent(dt):
              if not dt:
                  return False
              return dt >= datetime.now(timezone.utc) - timedelta(hours=24)

          def load_tickers():
              url = "https://www.sec.gov/files/company_tickers.json"
              raw = fetch(url)

              if not raw:
                  return {}

              try:
                  data = json.loads(raw)
              except Exception:
                  return {}

              result = {}

              for item in data.values():
                  ticker = str(item.get("ticker", "")).upper()
                  title = str(item.get("title", ""))

                  if ticker and title:
                      result[ticker] = title

              return result

          def ticker_from_title(title, ticker_map):
              upper = title.upper()

              explicit = re.findall(r"\(([A-Z]{1,5})\)", upper)

              for t in explicit:
                  if t in ticker_map:
                      return t

              return ""

          def company_candidates(title, ticker_map):
              normalized = re.sub(r"[^A-Z0-9 ]", " ", title.upper())
              normalized = re.sub(r"\s+", " ", normalized)

              found = []

              # Prefer longer company names to reduce false matches.
              companies = sorted(
                  ticker_map.items(),
                  key=lambda x: len(x[1]),
                  reverse=True
              )

              for ticker, name in companies:
                  n = re.sub(r"[^A-Z0-9 ]", " ", name.upper())
                  n = re.sub(r"\s+", " ", n).strip()

                  if len(n) < 5:
                      continue

                  if n in normalized:
                      found.append((ticker, name))

                      if len(found) >= 3:
                          break

              return found

          def news_events():
              queries = [
                  '"billion" (contract OR investment OR capex OR agreement) (AI OR data center OR infrastructure)',
                  '"billion" (supplier OR contractor OR purchase OR order) (AI OR semiconductor OR energy)',
                  '"million" (contract OR investment OR expansion OR facility) (AI OR infrastructure)',
                  '"capital expenditure" OR "capex" (data center OR AI OR semiconductor)'
              ]

              events = []

              for query in queries:
                  params = urllib.parse.urlencode({
                      "query": query,
                      "mode": "artlist",
                      "maxrecords": "25",
                      "format": "json",
                      "timespan": "24h"
                  })

                  url = "https://api.gdeltproject.org/api/v2/doc/doc?" + params
                  raw = fetch(url, timeout=20)

                  if not raw:
                      continue

                  try:
                      data = json.loads(raw)
                  except Exception:
                      continue

                  for article in data.get("articles", []):
                      title = clean_text(article.get("title", ""))
                      url2 = article.get("url", "")
                      source = article.get("domain", "")
                      seen = article.get("seendate", "")

                      if not title:
                          continue

                      text = title

                      score, amounts, beneficiary_hits = score_text(text)

                      if not amounts:
                          continue

                      if score < 25:
                          continue

                      events.append({
                          "type": "NEWS",
                          "title": title,
                          "link": url2,
                          "source": source,
                          "seen": seen,
                          "text": text,
                          "score": score,
                          "amounts": amounts,
                          "beneficiary_hits": beneficiary_hits
                      })

              return events

          def sec_events():
              feeds = [
                  ("8-K", "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=8-K&company=&dateb=&owner=exclude&count=100&output=atom"),
                  ("6-K", "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=6-K&company=&dateb=&owner=exclude&count=100&output=atom"),
                  ("S-1", "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=S-1&company=&dateb=&owner=exclude&count=100&output=atom"),
                  ("S-3", "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=S-3&company=&dateb=&owner=exclude&count=100&output=atom"),
                  ("424B4", "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=424B4&company=&dateb=&owner=exclude&count=100&output=atom")
              ]

              events = []

              for form, url in feeds:
                  raw = fetch(url)

                  if not raw:
                      continue

                  for item in parse_atom(raw):
                      dt = parse_time(item["updated"])

                      if not recent(dt):
                          continue

                      text = item["title"] + " " + item["summary"]

                      score, amounts, beneficiary_hits = score_text(text)

                      if score < 20:
                          continue

                      events.append({
                          "type": "SEC",
                          "form": form,
                          "title": item["title"],
                          "link": item["link"],
                          "source": "SEC",
                          "seen": item["updated"],
                          "text": text,
                          "score": score,
                          "amounts": amounts,
                          "beneficiary_hits": beneficiary_hits
                      })

              return events

          def yahoo_price(ticker):
              if not ticker:
                  return None

              url = (
                  "https://query1.finance.yahoo.com/v8/finance/chart/"
                  + urllib.parse.quote(ticker)
                  + "?range=5d&interval=1d"
              )

              raw = fetch(url, timeout=15)

              if not raw:
                  return None

              try:
                  data = json.loads(raw)
                  result = data["chart"]["result"][0]
                  closes = result["indicators"]["quote"][0]["close"]

                  closes = [x for x in closes if x is not None]

                  if len(closes) < 2:
                      return None

                  previous = closes[-2]
                  current = closes[-1]

                  if previous == 0:
                      return None

                  return ((current - previous) / previous) * 100
              except Exception:
                  return None

          def event_key(event):
              base = (
                  event.get("type", "")
                  + "|"
                  + event.get("title", "").lower()
              )

              return re.sub(r"[^a-z0-9|]+", "", base)[:220]

          def classify(score, price_move, direct):
              if direct:
                  beneficiary = "DIRECT / EXPLICIT"
              elif price_move is not None and abs(price_move) < 5:
                  beneficiary = "POTENTIAL INDIRECT"
              else:
                  beneficiary = "SPECULATIVE"

              if price_move is None:
                  repricing = "PRICE DATA UNAVAILABLE"
              elif price_move >= 8:
                  repricing = f"ALREADY REPRICED +{price_move:.1f}%"
              elif price_move >= 3:
                  repricing = f"EARLY REPRICING +{price_move:.1f}%"
              elif price_move <= -8:
                  repricing = f"NEGATIVE MOVE {price_move:.1f}%"
              else:
                  repricing = f"LIMITED MOVE {price_move:+.1f}%"

              if score >= 75:
                  alpha = "HIGH SIGNAL"
              elif score >= 55:
                  alpha = "STRONG SIGNAL"
              elif score >= 35:
                  alpha = "WATCH"
              else:
                  alpha = "LOWER SIGNAL"

              if price_move is None or abs(price_move) < 3:
                  first_mover = "POSSIBLE FIRST-MOVER WINDOW"
              elif abs(price_move) < 8:
                  first_mover = "PARTIALLY REPRICED"
              else:
                  first_mover = "LARGELY REPRICED"

              return beneficiary, repricing, alpha, first_mover

          def telegram(message):
              token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
              chat = os.environ.get("TELEGRAM_CHAT_ID", "")

              if not token or not chat:
                  raise RuntimeError("Telegram secrets are missing.")

              url = f"https://api.telegram.org/bot{token}/sendMessage"

              payload = urllib.parse.urlencode({
                  "chat_id": chat,
                  "text": message,
                  "disable_web_page_preview": "true"
              }).encode()

              req = urllib.request.Request(url, data=payload, method="POST")

              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.read().decode("utf-8", errors="replace")

          # ------------------------------------------------------------
          # MAIN RADAR
          # ------------------------------------------------------------

          print("Starting Capital Flow Radar...")

          ticker_map = load_tickers()
          print(f"Loaded {len(ticker_map)} SEC-listed companies.")

          events = []
          events.extend(sec_events())
          events.extend(news_events())

          print(f"Raw qualifying events: {len(events)}")

          # Deduplicate within this run.
          unique = {}

          for event in events:
              key = event_key(event)

              if key not in unique or event["score"] > unique[key]["score"]:
                  unique[key] = event

          events = list(unique.values())

          # Load persistent state.
          try:
              with open(STATE_FILE, "r", encoding="utf-8") as f:
                  state = json.load(f)
          except Exception:
              state = {"seen": []}

          seen = set(state.get("seen", []))

          alerts = []

          for event in sorted(events, key=lambda x: x["score"], reverse=True):

              key = event_key(event)

              if key in seen:
                  continue

              title = event["title"]
              text = event["text"]

              ticker = ticker_from_title(title, ticker_map)

              candidates = company_candidates(title, ticker_map)

              if not ticker and candidates:
                  ticker = candidates[0][0]

              direct = event["beneficiary_hits"] >= 1

              price_move = yahoo_price(ticker) if ticker else None

              beneficiary, repricing, alpha, first_mover = classify(
                  event["score"],
                  price_move,
                  direct
              )

              # Do not promote purely speculative events to the main alert.
              if beneficiary == "SPECULATIVE" and event["score"] < 70:
                  seen.add(key)
                  continue

              amount = money_label(event["amounts"])

              candidate_text = ""

              if candidates:
                  candidate_text = "\n".join(
                      f"• {t} — {n}" for t, n in candidates
                  )
              elif ticker:
                  candidate_text = f"• {ticker}"
              else:
                  candidate_text = "• No public-company beneficiary verified yet"

              if ticker:
                  bamboo = "CHECK REQUIRED — verify ticker in Bamboo before execution"
                  entry = (
                      f"Wait for confirmation above the catalyst/reaction high "
                      f"with volume; avoid chasing a large gap."
                  )
                  exit_plan = (
                      "Invalidation: below the catalyst reaction low. "
                      "If momentum stalls for ~5 trading sessions, reassess/exit. "
                      "Consider taking partial profit into a strong +10–15% move."
                  )
              else:
                  bamboo = "NOT VERIFIED"
                  entry = "No trade until a listed beneficiary is verified."
                  exit_plan = "No position until beneficiary/ticker is verified."

              message = (
                  "🚨 CAPITAL FLOW ALERT\n\n"
                  f"EVENT: {title}\n"
                  f"SOURCE: {event.get('source', 'SEC')}"
                  f" {event.get('form', '')}\n"
                  f"CAPITAL: {amount}\n\n"
                  "PUBLIC-COMPANY CANDIDATES:\n"
                  f"{candidate_text}\n\n"
                  f"BENEFICIARY STATUS: {beneficiary}\n"
                  f"ALPHA SIGNAL: {alpha} ({event['score']}/100)\n"
                  f"MARKET MOVE: {repricing}\n"
                  f"FIRST-MOVER: {first_mover}\n\n"
                  f"BAMBOO: {bamboo}\n\n"
                  f"ENTRY: {entry}\n\n"
                  f"EXIT PLAN: {exit_plan}\n\n"
                  f"SEC/NEWS: {event['link']}"
              )

              alerts.append((key, message))

          # Send no more than 5 new alerts per run.
          alerts = alerts[:5]

          if alerts:
              for key, message in alerts:
                  try:
                      telegram(message)
                      print("Telegram alert sent.")
                      seen.add(key)
                  except Exception as e:
                      print("Telegram error:", e)
          else:
              print("No new qualifying alerts.")

          # Keep state manageable.
          state["seen"] = list(seen)[-2000:]

          with open(STATE_FILE, "w", encoding="utf-8") as f:
              json.dump(state, f, indent=2)

          print("Radar completed successfully.")
          PY

      - name: Save radar state
        run: |
          git config user.name "Capital Flow Radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add radar_state.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update capital flow radar state"
            git push
          fi
