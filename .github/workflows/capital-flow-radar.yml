name: Capital Flow Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Analyze SEC filings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import gzip
          import re
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from html import unescape
          from datetime import datetime, timezone

          USER_AGENT = "Capital Flow Radar veronicajyde@gmail.com"

          RSS_URL = (
              "https://www.sec.gov/cgi-bin/browse-edgar"
              "?action=getcurrent"
              "&type=8-K"
              "&company="
              "&dateb="
              "&owner=exclude"
              "&count=100"
              "&output=atom"
          )

          headers = {
              "User-Agent": USER_AGENT,
              "Accept-Encoding": "gzip, deflate",
              "Accept": "application/atom+xml,application/xml,text/xml"
          }

          def get_url(url):
              request = urllib.request.Request(
                  url,
                  headers=headers
              )

              response = urllib.request.urlopen(
                  request,
                  timeout=30
              )

              raw = response.read()

              if response.headers.get("Content-Encoding") == "gzip":
                  raw = gzip.decompress(raw)

              return raw

          def clean_html(text):
              text = unescape(text or "")
              text = re.sub(r"<[^>]+>", " ", text)
              text = re.sub(r"\s+", " ", text)
              return text.strip()

          # --------------------------------------------------
          # GET LATEST SEC FILINGS
          # --------------------------------------------------

          raw = get_url(RSS_URL)
          root = ET.fromstring(raw)

          ns = {
              "atom": "http://www.w3.org/2005/Atom"
          }

          entries = root.findall("atom:entry", ns)

          print("SEC connection successful.")
          print("Filings retrieved:", len(entries))

          # --------------------------------------------------
          # CAPITAL-FLOW SIGNALS
          # --------------------------------------------------

          strong_signals = [
              "capital expenditure",
              "capital expenditures",
              "capex",
              "construction",
              "data center",
              "data centre",
              "infrastructure",
              "manufacturing facility",
              "production facility",
              "new facility",
              "facility expansion",
              "capacity expansion",
              "purchase commitment",
              "purchase commitments",
              "supply agreement",
              "long-term supply",
              "definitive agreement",
              "material definitive agreement",
              "contract award",
              "awarded contract",
              "government contract",
              "financing agreement",
              "credit facility",
              "term loan",
              "acquisition",
              "merger",
              "investment agreement",
              "strategic investment"
          ]

          money_pattern = re.compile(
              r"""
              (?:
                  \$\s?
                  |
                  USD\s?
              )
              (?:
                  \d+(?:,\d{3})*
                  |
                  \d+(?:\.\d+)?
              )
              \s?
              (?:billion|million|thousand|bn|mm|m|k)?
              """,
              re.IGNORECASE | re.VERBOSE
          )

          # Words that often indicate the filing is NOT what
          # our capital-flow radar is looking for.
          weak_only_terms = {
              "governance",
              "director",
              "appointment",
              "resignation",
              "compensation",
              "earnings",
              "quarterly results",
              "press release",
              "legal proceedings"
          }

          candidates = []

          # --------------------------------------------------
          # ANALYZE EACH FILING
          # --------------------------------------------------

          for entry in entries:

              title = entry.findtext(
                  "atom:title",
                  "",
                  ns
              ).strip()

              summary = entry.findtext(
                  "atom:summary",
                  "",
                  ns
              ).strip()

              published = entry.findtext(
                  "atom:updated",
                  "",
                  ns
              ).strip()

              link_element = entry.find(
                  "atom:link",
                  ns
              )

              link = ""

              if link_element is not None:
                  link = link_element.attrib.get(
                      "href",
                      ""
                  )

              summary_clean = clean_html(summary)

              combined = (
                  title + " " + summary_clean
              ).lower()

              matched = [
                  signal
                  for signal in strong_signals
                  if signal in combined
              ]

              if not matched:
                  continue

              # ------------------------------------------------
              # SCORE THE FILING
              # ------------------------------------------------

              score = 0

              # Strong capital-flow language
              score += min(len(matched) * 10, 40)

              # Dollar amount mentioned
              money_matches = money_pattern.findall(
                  combined
              )

              if money_matches:
                  score += 25

              # Infrastructure / construction / capacity
              infrastructure_words = [
                  "data center",
                  "data centre",
                  "infrastructure",
                  "construction",
                  "manufacturing facility",
                  "production facility",
                  "capacity expansion",
                  "facility expansion"
              ]

              if any(
                  word in combined
                  for word in infrastructure_words
              ):
                  score += 20

              # Contract / supply relationship
              if any(
                  word in combined
                  for word in [
                      "supply agreement",
                      "purchase commitment",
                      "contract award",
                      "government contract",
                      "long-term supply"
                  ]
              ):
                  score += 15

              # Reduce weak-only filings
              weak_matches = [
                  word
                  for word in weak_only_terms
                  if word in combined
              ]

              if weak_matches and not money_matches:
                  score -= 20

              score = max(0, min(score, 100))

              # Only send meaningful candidates
              if score < 40:
                  continue

              candidates.append({
                  "title": title,
                  "summary": summary_clean[:700],
                  "published": published,
                  "link": link,
                  "signals": matched[:6],
                  "money": money_matches[:5],
                  "score": score
              })

          # Highest scoring first
          candidates.sort(
              key=lambda x: x["score"],
              reverse=True
          )

          candidates = candidates[:5]

          print(
              "Qualified capital-flow candidates:",
              len(candidates)
          )

          # --------------------------------------------------
          # TELEGRAM MESSAGE
          # --------------------------------------------------

          if not candidates:
              print(
                  "No qualifying capital-flow event detected."
              )
              raise SystemExit(0)

          lines = [
              "🚨 CAPITAL FLOW RADAR",
              "",
              "NEW CAPITAL-FLOW EVENT",
              ""
          ]

          for item in candidates:

              lines.append(
                  f"📊 SIGNAL SCORE: {item['score']}/100"
              )

              lines.append(
                  f"📄 {item['title']}"
              )

              if item["money"]:
                  lines.append(
                      "💰 Amount detected: "
                      + ", ".join(item["money"])
                  )

              lines.append(
                  "🔎 Signals: "
                  + ", ".join(item["signals"])
              )

              if item["summary"]:
                  lines.append(
                      "📝 "
                      + item["summary"]
                  )

              if item["published"]:
                  lines.append(
                      "🕐 " + item["published"]
                  )

              if item["link"]:
                  lines.append(
                      "🔗 " + item["link"]
                  )

              lines.append("")

          lines
